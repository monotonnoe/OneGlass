pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Classic Xposed API (compileOnly, provided by LSPosed at runtime)
        maven { url 'https://api.xposed.info/' }
    }
}

rootProject.name = 'OneGlass'
include ':app'
