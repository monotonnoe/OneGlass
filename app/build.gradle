plugins {
    id 'com.android.application'
}

android {
    namespace 'com.monotonnoe.oneglass'
    compileSdk 36

    defaultConfig {
        applicationId 'com.monotonnoe.oneglass'
        // One UI 8.5 = Android 16 (API 36). AGSL RuntimeShader needs API 33+.
        minSdk 33
        targetSdk 36
        versionCode 3
        versionName "0.2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            // LSPosed modules do not need a store signature; the debug key keeps CI builds installable.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
